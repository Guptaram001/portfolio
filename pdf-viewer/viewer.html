<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PDF Viewer</title>

    <style>
      body {
        margin: 0;
        background: #0f172a;
      }

      iframe {
        width: 100%;
        height: 100vh;
        border: none;
      }
    </style>
  </head>

  <body>
    <script>
      const params = new URLSearchParams(window.location.search);

      const file = params.get("file");

      document.write(`
  <iframe
    src="https://mozilla.github.io/pdf.js/web/viewer.html?file=${file}">
  </iframe>
`);
    </script>
  </body>
</html>
